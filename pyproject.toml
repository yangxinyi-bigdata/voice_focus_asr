[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voice-focus-asr"
version = "0.1.0"
description = "Target-speaker-focused real-time speech transcription"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "yangxinyi-bigdata" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
]
qwen = [
  "websockets>=14.1",
]

[project.scripts]
voice-focus-asr = "voice_focus_asr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_focus_asr"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["voice_focus_asr"]
